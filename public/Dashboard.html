<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Ansel Ong">
    <link rel="stylesheet" href="CSS/Dashboard.css">
</head>

<body>
    <div class="edit-container">
        <h2>Play with your pages</h2>

        <!-- ✅ Proper form wrapper -->
        <form action="/updateProfile" method="POST">

            <div class="edit-card">
                <h3>Homepage Introduction</h3>
                <label for="homepageText">Introduction:</label>
                <textarea id="homepageText" name="homepageText"></textarea>
            </div>

            <div class="edit-card">
                <h3>About Me</h3>
                <label for="bio">Biography:</label>
                <textarea id="bio" name="bio"></textarea>
            </div>

            <div class="edit-card">
                <h3>Skills</h3>
                <label for="skills">Skills:</label>
                <!-- Input is short and simple, thus X textarea-->
                <input id="skills" type="text" name="skills">
            </div>

            <div class="edit-card">
                <h3>Projects</h3>
                <label for="projects">Projects:</label>
                <textarea id="projects" name="projects"></textarea>
            </div>

            <button type="submit">Save Changes</button>
        </form>
    </div>
</body>

</html>
