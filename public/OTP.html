<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Verify OTP</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background: #f9f9f9;
        }

        .container {
            max-width: 400px;
            margin: auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 12px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #0078d7;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #005fa3;
        }

        .error {
            color: red;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Verify OTP</h1>
        <form method="POST" action="/verify-otp">
            <label for="otp">Enter the 6-digit code sent to your email:</label>
            <input type="text" id="otp" name="otp" maxlength="6" required>
            <button type="submit">Verify</button>
        </form>

        <!-- Show error if query param exists -->
        <div class="error">
            <script>
                const params = new URLSearchParams(window.location.search);
                if (params.get("error")) {
                    document.write(params.get("error"));
                }
            </script>
        </div>
    </div>
</body>

</html>
