
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload & Preview</title>

    <link rel="stylesheet" href="../public/CSS/Portfolio.css">
    <link rel="stylesheet" href="../public/CSS/Home.css">
    <link rel="stylesheet" href="../public/CSS/Color.css">
</head>

<body>
    <!-----------------------------
     |   PLACEHOLDER: NAV-LINKS   |
     ------------------------------>
    <div id="navbar"></div>

    <div class="container">
        <h1>Upload any FILE to Preview</h1>

        <div class="upload-box" id="uploadBox">
            <p>Select/Drag & Drop a file to preview instantly</p>
            <input type="file" id="fileInput" multiple>
        </div>

        <!-- Progress Bar -->
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>

        <div id="preview" class="preview"></div>
    </div>

    <!-------------------------------------
     |   PLACEHOLDER: COPY RIGHT FOOTER   |
     -------------------------------------->
        <div id="footer"></div>

    <!--------------------
     |   LINKAGE TO JS   |
     --------------------->
    <script src="../public/JS/Portfolio.js"></script>
    <script src="../public/JS/Home.js"></script>
    

</body>

</html>
