<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Login Page</title>
    <link rel="stylesheet" href="../docs/CSS/Home.css">
    <link rel="stylesheet" href="../docs/CSS/Login.css">
    <link rel="stylesheet" href="../docs/CSS/Color.css">


</head>

<body>
    <!-----------------------------
     |   PLACEHOLDER: NAV-LINKS   |
     ------------------------------>
    <div id="navbar"></div>


    <div class="login-container">
        <div class="login-box">
            <h1 class="login-header">Login</h1>
            <form action="/login" method="POST">
                <label>Username:</label>
                <input type="text" name="username" required>

                <label>Password:</label>
                <div class="password-container">
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                    <button type="button" id="togglePassword" aria-label="Show password"></button>
                </div>
                <label class="remember">
                    <input type="checkbox" id="rememberMe"> Remember ME!!
                </label>

                <button type="submit">Login</button>
            </form>
        </div>
    </div>

    <!------------------------------------
    |   PLACEHOLDER: COPY RIGHT FOOTER   |
    -------------------------------------->
    <div id="footer"></div>

    <!--------------------
     |   LINKAGE TO JS   |
     --------------------->
    <script src="../docs/JS/Login.js"></script>
    <script src="../docs/JS/Home.js"></script>

</body>

</html>
